# Runs the full pytest suite on every push and pull request, on Python 3.11
# and 3.12. No API keys or internet access to the real APIs are needed: the
# tests start the real MCP server over stdio and point it at a local fake
# API (see tests/conftest.py).

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:      # allows a manual run from the Actions tab

# Read-only token: this workflow only needs to check out the code.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now-outdated run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false    # report both Python versions even if one fails
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show versions
        run: |
          python --version
          python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"
          python -m pip list | grep -iE '^(mcp|httpx|pytest|mcp-weather-advisor) '
          command -v mcp-weather-advisor

      # The SQLite cache gets its own step, so a cache failure is obvious at
      # a glance in the Actions UI.
      - name: SQLite cache tests
        run: >
          python -m pytest tests/test_cache.py
          -v --color=yes --durations=5
          --basetemp="$RUNNER_TEMP/pytest-cache"
          --junitxml="$RUNNER_TEMP/junit/cache.xml"

      # Everything else: MCP protocol and all four tools over stdio, API
      # failure handling, structured logging, packaging, unit tests. Runs
      # even if the cache step failed, so every problem is reported at
      # once. New test files are picked up automatically.
      - name: MCP stdio tools, logging, packaging and unit tests
        if: ${{ !cancelled() }}
        run: >
          python -m pytest
          --ignore=tests/test_cache.py
          -v --color=yes --durations=10
          --basetemp="$RUNNER_TEMP/pytest-main"
          --junitxml="$RUNNER_TEMP/junit/main.xml"

      # On failure, keep the evidence: JUnit reports plus each test's
      # server stderr and mcp_server.log (stored in the pytest temp dirs).
      - name: Upload test reports and server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-output-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/junit/
            ${{ runner.temp }}/pytest-cache/
            ${{ runner.temp }}/pytest-main/
          retention-days: 7
          if-no-files-found: ignore
